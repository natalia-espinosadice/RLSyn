setup:
  runner: train_dpdm_base
  CUDA_DEVICES: 0
  n_gpus_per_node: 1
  n_nodes: 1
  node_rank: 0
  master_address: '127.0.0.1'
  master_port: 60202
  omp_n_threads: 64
data:
  path: "/Users/nataliaespinosa-dice/Desktop/synth_data/rl_synth/MIMIC" #modified 
  name: mimic
  resolution: 1485 #1782 #num features 
  dataloader_params:
    num_workers: 1
  n_classes: None #num classes for conditional generation 
model:
  denoiser_name: edm
  denoiser_network: song
  ema_rate: .999
  params:
    sigma_data: 0.0645 #0.14
    sigma_min: .02
    sigma_max: 80.
  network:
    z_dim: 1485 #1782
    time_dim: 448
    unit_dims: [1024, 448, 448, 448, 1024]
    use_cfg: False
optim:
  optimizer: AdamW
  params:
    lr: 0.000625407480018934
    weight_decay: 0.

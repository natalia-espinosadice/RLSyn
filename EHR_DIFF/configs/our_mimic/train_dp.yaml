  solver: 'heun'
  discretization: 'edm'
  stochastic: False
  num_steps: 32
  sigma_min: .02
  sigma_max: 80.
  rho: 7.
  guid_scale: None
train:
  seed: 0
  batch_size: 2304
  warmup_steps: 0
  n_epochs: 3000
  check_freq: 5000
  save_freq: 100000 #20000
loss: 
  version: edm
  p_mean: -1.2
  p_std: 1.2
  sigma_data: 0.0645 #0.14
  n_noise_samples: 4
  n_classes: None
dp:
  do: True
  max_grad_norm: 1.1
  delta: 1e-5
  epsilon: 10.
  max_physical_batch_size: 1024
  n_splits: 8